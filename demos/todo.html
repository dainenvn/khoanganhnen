<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Todo List demo: lưu công việc trong trình duyệt"><title>Todo List · Khoàng Văn Nên</title><style>:root{font-family:system-ui,sans-serif;color:#0f172a;background:#f1f5f9}*{box-sizing:border-box}body{margin:0;padding:24px}.app{max-width:720px;margin:40px auto;background:#fff;border-radius:18px;padding:28px;box-shadow:0 12px 36px #0f172a18}h1{margin-top:0}a{color:#1d4ed8}form{display:flex;gap:8px}input{flex:1;min-width:0;padding:12px;border:1px solid #94a3b8;border-radius:8px;font:inherit}button{font:inherit;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:#1d4ed8;color:white}button.secondary{background:#475569}button.danger{background:#b91c1c}button:focus-visible,input:focus-visible{outline:3px solid #1d4ed8;outline-offset:2px}ul{list-style:none;padding:0}li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #e2e8f0;flex-wrap:wrap}li span{flex:1;overflow-wrap:anywhere}li.done span{text-decoration:line-through;color:#64748b}.muted{color:#475569}@media(max-width:480px){.app{padding:16px}form{flex-direction:column}li button{padding:8px}}</style></head><body><main class="app"><p><a href="../index.html#du-an-2">← Trở về Portfolio</a></p><h1>Todo List</h1><p class="muted">Demo độc lập sử dụng JavaScript và LocalStorage. Dữ liệu chỉ lưu trên trình duyệt đang dùng.</p><form id="task-form"><label for="task-input" class="muted">Công việc mới</label><input id="task-input" maxlength="160" required placeholder="Ví dụ: Hoàn thiện bài tập FIT4014"><button type="submit">Thêm</button></form><p id="count" aria-live="polite"></p><ul id="tasks" aria-label="Danh sách công việc"></ul><p id="empty" class="muted">Chưa có công việc nào.</p></main><script src="todo.js" defer></script></body></html>
